<title>Sage Day Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Template for track3d.py --html: the line "const TRACK = /*DATA*/null;" is replaced with the day's points. -->
<style>
  :root { color-scheme: dark; --bg: #0b0c0a; --panel: #151713; --fg: #e2d9c9; --muted: #8a877d; --sage: #8c9a7e; --line: #2a2d27; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px -apple-system, system-ui, sans-serif;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: 16px; display: grid; gap: 12px; }
  h1 { font: 600 20px Georgia, serif; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
           height: min(70vh, 640px); touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .hud { position: absolute; left: 12px; top: 10px; font-variant-numeric: tabular-nums; line-height: 1.5; pointer-events: none; }
  .hud b { color: #fff; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row label { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  input[type=range] { accent-color: var(--sage); }
  #time { flex: 1; min-width: 200px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px;
                         background: var(--c); vertical-align: -1px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat div:first-child { color: var(--muted); font-size: 12px; }
  .stat div:last-child { font-size: 17px; font-variant-numeric: tabular-nums; }
</style>
<h1 id="title">Day path</h1>
<div class="sub" id="sub">Drag to rotate, scroll or pinch to zoom. Colours are floors.</div>
<div class="stats" id="stats"></div>
<div class="stage"><canvas id="c"></canvas><div class="hud" id="hud"></div></div>
<div class="row">
  <label for="time">Time</label><input id="time" type="range" min="0" max="1000" value="1000">
  <label>Height ×<input id="zx" type="range" min="1" max="20" value="6"></label>
  <label><input id="top" type="checkbox"> Top view</label>
</div>
<div class="legend" id="legend"></div>
<script>
const TRACK = /*DATA*/null;
// demo data when opened without a day (a loop with stairs), so the page is never empty
const data = TRACK || (() => {
  const p = []; let x = 0, y = 0, z = 0;
  for (let i = 0; i < 1200; i++) {
    const a = i / 60; x += Math.sin(a) * 1.1; y += Math.cos(a * 0.7) * 1.1;
    if (i > 400 && i < 440) z += 0.15; if (i > 800 && i < 840) z -= 0.15;
    p.push([1796000000 + i, x, y, z, Math.round(z / 3), 3 + (i > 300 && i < 900 ? 4 : 0), i > 300 && i < 900 ? 1 : 0]);
  }
  return { name: "Example (no day loaded)", points: p };
})();
const P = data.points;   // [t, x, y, alt, floor, h_acc, indoor]
const tz = data.tz || undefined;
const fmt = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", timeZone: tz });
document.getElementById("title").textContent = data.name || "Day path";
const floors = [...new Set(P.map(p => p[4]).filter(f => f !== null))].sort((a, b) => a - b);
const palette = ["#8c9a7e", "#c9a877", "#7fa6c9", "#c98f7a", "#a98cc9", "#7ac9b0", "#c9c27a"];
const colorOf = f => f === null ? "#666" : palette[(floors.indexOf(f) + palette.length) % palette.length];
document.getElementById("legend").innerHTML = floors.map(f => `<span style="--c:${colorOf(f)}">Floor ${f}</span>`).join("");

// stats
let walked = 0;
for (let i = 1; i < P.length; i++) walked += Math.hypot(P[i][1] - P[i - 1][1], P[i][2] - P[i - 1][2]);
const changes = P.reduce((n, p, i) => n + (i && p[4] !== null && P[i - 1][4] !== null && p[4] !== P[i - 1][4] ? 1 : 0), 0);
const minutesPer = {}; for (const p of P) if (p[4] !== null) minutesPer[p[4]] = (minutesPer[p[4]] || 0) + 1 / 60 * (data.step || 1);
const stat = (k, v) => `<div class="stat"><div>${k}</div><div>${v}</div></div>`;
document.getElementById("stats").innerHTML =
  stat("Time", `${fmt(P[0][0])} – ${fmt(P[P.length - 1][0])}`) + stat("Walked", `${(walked / 1000).toFixed(2)} km`) +
  stat("Floor changes", changes) + stat("Indoors", `${Math.round(P.filter(p => p[6]).length * (data.step || 1) / 60)} min`) +
  floors.map(f => stat(`Floor ${f}`, `${Math.round(minutesPer[f])} min`)).join("");

// 3D view: centre, orbit camera, simple perspective
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const cx = P.reduce((s, p) => s + p[1], 0) / P.length, cy = P.reduce((s, p) => s + p[2], 0) / P.length;
const alts = P.map(p => p[3]).filter(a => a !== null), z0 = alts.length ? Math.min(...alts) : 0;
const span = Math.max(...P.map(p => Math.hypot(p[1] - cx, p[2] - cy)), 10);
let yaw = -0.6, pitch = 0.9, zoom = 1, ex = 6, upTo = P.length - 1;
function project(p) {
  const x = p[1] - cx, y = p[2] - cy, z = ((p[3] ?? z0) - z0) * ex;
  const top = document.getElementById("top").checked;
  const ya = top ? 0 : yaw, pi = top ? Math.PI / 2 : pitch;
  const x1 = x * Math.cos(ya) - y * Math.sin(ya), y1 = x * Math.sin(ya) + y * Math.cos(ya);
  const y2 = y1 * Math.sin(pi) - z * Math.cos(pi), d = y1 * Math.cos(pi) + z * Math.sin(pi);
  const s = (Math.min(cv.width, cv.height) * 0.42 / span) * zoom, persp = 1 / (1 + d / (span * 4));
  return [cv.width / 2 + x1 * s * persp, cv.height / 2 + y2 * s * persp];
}
function draw() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (cv.width !== r.width * dpr) { cv.width = r.width * dpr; cv.height = r.height * dpr; }
  ctx.clearRect(0, 0, cv.width, cv.height);
  // ground grid at the lowest floor
  ctx.strokeStyle = "#1f221c"; ctx.lineWidth = 1;
  const g = Math.pow(10, Math.floor(Math.log10(span))) / 2;
  for (let v = -span; v <= span; v += g) {
    let a = project([0, cx + v, cy - span, z0]), b = project([0, cx + v, cy + span, z0]);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    a = project([0, cx - span, cy + v, z0]); b = project([0, cx + span, cy + v, z0]);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }
  ctx.lineWidth = 2 * (devicePixelRatio || 1); ctx.lineJoin = "round";
  for (let i = 1; i <= upTo; i++) {
    const a = project(P[i - 1]), b = project(P[i]);
    ctx.strokeStyle = colorOf(P[i][4]); ctx.globalAlpha = P[i][6] ? 0.95 : 0.7;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const m = P[upTo], q = project(m);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(q[0], q[1], 6 * (devicePixelRatio || 1), 0, 7); ctx.fill();
  document.getElementById("hud").innerHTML =
    `<b>${fmt(m[0])}</b><br>Floor ${m[4] ?? "–"} · ${m[3] !== null ? m[3].toFixed(1) + " m" : "–"}<br>±${m[5].toFixed(1)} m · ${m[6] ? "indoors (steps + compass)" : "GPS"}`;
}
// interaction
let drag = null;
cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, yaw, pitch]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!drag) return; yaw = drag[2] + (e.clientX - drag[0]) * 0.008;
  pitch = Math.max(0.1, Math.min(1.55, drag[3] + (e.clientY - drag[1]) * 0.006)); draw();
});
cv.addEventListener("pointerup", () => drag = null);
cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.max(0.3, Math.min(20, zoom * Math.exp(-e.deltaY / 500))); draw(); }, { passive: false });
let pinch = null;
cv.addEventListener("touchmove", e => {
  if (e.touches.length !== 2) return; const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) zoom = Math.max(0.3, Math.min(20, zoom * d / pinch)); pinch = d; draw();
}, { passive: true });
cv.addEventListener("touchend", () => pinch = null);
document.getElementById("time").addEventListener("input", e => { upTo = Math.max(1, Math.round(e.target.value / 1000 * (P.length - 1))); draw(); });
document.getElementById("zx").addEventListener("input", e => { ex = +e.target.value; draw(); });
document.getElementById("top").addEventListener("change", draw);
addEventListener("resize", draw);
draw();
</script>
