name: Sage
options:
  bundleIdPrefix: dev.sage
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # unsigned build: the IPA is re-signed on install (SideStore with a free Apple ID)
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Sage:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Sage Data
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: The watch's data probe reads every Health type the watch records, for testing. Nothing leaves your devices.
        NSHealthUpdateUsageDescription: The watch probe runs as a Mind & Body workout session to keep recording; it is discarded and never saved to Health.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SageWatch
  SageWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Sage Data
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.sage.companion
        NSHealthShareUsageDescription: The data probe reads every Health type the watch records and sends it to your iPhone, for testing. Nothing leaves your devices.
        NSHealthUpdateUsageDescription: The probe runs as a Mind & Body workout session to keep recording and to read heart rate every few seconds. It is discarded, never saved to Health.
        NSLocationWhenInUseUsageDescription: The data probe records GPS fixes and the compass and sends them to your iPhone. Nothing leaves your devices.
        UIBackgroundModes: [location]
        NSMotionUsageDescription: The data probe records motion, the barometer, steps and activity and sends them to your iPhone. Nothing leaves your devices.
        WKBackgroundModes: [workout-processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
  SageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Sage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sage.app/Sage
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sage:
    build:
      targets:
        Sage: all
    test:
      targets: [SageTests]
      gatherCoverageData: true
