name: Sage
options:
  bundleIdPrefix: dev.sage
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.6"
    CURRENT_PROJECT_VERSION: "1"
    # unsigned build: the IPA is re-signed on install (Sideloadly / AltStore with a free Apple ID)
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Sage:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Sage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [PlayfairDisplay-Regular.ttf, PlayfairDisplay-Italic.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: Sage shows your steps, heart rate and sleep on the watch face and in the app. Nothing leaves your devices.
        NSHealthUpdateUsageDescription: The watch recorder runs as a Mind & Body session. It is only saved to Health if you turn that on.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SageWatch
  SageWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: Resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Sage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.sage.companion
        UIAppFonts: [PlayfairDisplay-Regular.ttf, PlayfairDisplay-Italic.ttf]
        NSHealthShareUsageDescription: Sage shows your steps and heart rate on the face and records your heart rate while the recorder runs. Nothing leaves your devices.
        NSHealthUpdateUsageDescription: The recorder runs as a Mind & Body session to keep Sage on screen and read heart rate every few seconds. It is only saved to Health if you turn that on.
        NSMotionUsageDescription: Sage records wrist motion and air pressure for your sleep data and feels for light sleep during the wake window. The files go only to your iPhone.
        WKBackgroundModes: [smart-alarm, workout-processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: SageComplications
  SageComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: Complications
      - path: Shared/SleepPlan.swift
    info:
      path: Complications/Info.plist
      properties:
        CFBundleDisplayName: Sage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion.watchkitapp.complications
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  SageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Sage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sage.companion.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sage.app/Sage
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sage:
    build:
      targets:
        Sage: all
    test:
      targets: [SageTests]
      gatherCoverageData: true
